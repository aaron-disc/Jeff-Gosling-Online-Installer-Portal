services:
  # 1. Database
  db:
    image: mysql:8.0
    container_name: db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: paramHmac_147
      MYSQL_DATABASE: jg_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-pparamHmac_147",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - app-network

  # 2. Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: db # Points to the 'db' service container name
      DB_USER: root
      DB_PASSWORD: paramHmac_147 # Aligned with MYSQL_ROOT_PASSWORD
      DB_NAME: jg_db # Aligned with MYSQL_DATABASE
      DB_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # 3. Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mysql_data: # Persists data even if containers stop

networks:
  app-network:
    driver: bridge
